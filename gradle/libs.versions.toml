[versions]
agp = "8.13.2"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
compose-bom = "2025.01.01"
room = "2.7.0"
hilt = "2.55"
hilt-navigation-compose = "1.2.0"
