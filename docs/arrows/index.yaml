  reminders:
    status: PARTIAL
    sampled: 2026-08-12
    audited: 2026-08-14
    audited_sha: 2e897ea72bdd3d4eee6baf6f25eb95659d6bbb12
    blocks: []
    blockedBy: [local-storage, category-management]
    detail: reminders.md
    # 2026-08-23: REM-SCHED-021 and REM-NOTIF-013 added (62 specs, was 60) for the two interfaces the DI
    # module binds, which no spec covered while the module cited APP-REM-001, a spec it does not
    # implement. REM-SCHED-021 was closed the same day by backlog #18: the save-time exact-alarm
    # check was computed in the composable and handed to save() as a defaulted boolean, so the
    # branch that blocks a save on a permission problem could only be tested by supplying its own
    # answer. ReminderScheduler now exposes canScheduleExact() and save() asks it. Four
    # REM-UI-001..011 range annotations, which match nothing under grep, are gone: three were
    # duplicates at call sites, one became literal IDs. See reminders.md finding 17.
    next: "19 of 51 specs have no test-file @spec citation (18 of 49 as of the 2026-08-14 backfill, plus REM-PERM-005, which needs Compose UI infra). REM-DATA-001 needs a Room instrumented test — one was written and passing on 2026-08-14, then removed at the user's request; deferred, not abandoned. REM-UI-*/REM-PERM-*/REM-NOTIF-*/REM-SCHED-009/010 need instrumented test infra (Compose UI, notification, real-AlarmManager) that doesn't exist anywhere in the project yet, not reminders-specific."
    drift: "REM-DATA-010 rewritten 2026-08-23 from a daysActive rule into a whole-decoder rule (still 60 specs): ReminderEntity.toDomain() was partial in six places — two enum lookups, two time parses, and two rows that parsed cleanly but were unusable downstream — on a startup path where a throw ends the process, so one row the app did not write would have crashed every launch. Now one try around the whole decode falling back to Reminder.default(categoryId), which also became the single place a fresh reminder's values are written, read by the edit form as well (see reminders.md finding 16). REM-UI-006a added and REM-UI-006 rewritten 2026-08-23 (60 specs, was 59): the Times per day field derived its text from an Int and rejected any edit outside 1..12, so it could never be cleared and, being unclearable, could only be appended to — from the default of 1 that reaches 11 and 12 and nothing else, leaving 2 through 10 unreachable. It now holds text with a two-digit character check in the ViewModel (1-99), and empty or 0 is refused at save under its own key rather than reported as a window error (see reminders.md finding 15). REM-NOTIF-007/008/009/010/011/012 added and REM-NOTIF-004 reversed 2026-08-21 (59 specs, was 53): reminders that have fired and not been dealt with are now listed on the timeline, with the notification shade as their only store, read into a StateFlow the notifier updates on every change — the app posting, the app cancelling, and the user dismissing via setDeleteIntent (see reminders.md finding 14). REM-NOTIF-004 previously mandated no group summary, which is what made tapping a bundled notification do nothing (backlog #33); a real summary with setAutoCancel(false) fixes it and is required by the design, since the tap leads to a list built from those notifications. Notification identity moved from categoryId.hashCode() to a string tag, retiring the collision risk recorded as accepted. Verified on device. REM-DATA-010 added 2026-08-19 (53 specs, was 52): the decoder's empty-daysActive demotion was real, tested, and stated in no spec — code and all three tests cited REM-DATA-002, which describes the flat schema and says nothing about it; citations re-pointed. REM-DATA-009 added 2026-08-19 (52 specs, was 51): the permission banner's precondition was derived from the category-list StateFlow, so enabling a reminder without editing a category field re-emitted an equal list that conflation dropped and the banner stayed hidden until an unrelated category write or a WhileSubscribed lapse; replaced by an observable read of the reminder store (see reminders.md finding 13), which also stopped loading every enabled reminder on every unrelated category write. FakeTrackrRepository.deleteCategory was fixed in the same pass to drop the reminder like the real ON DELETE CASCADE does. REM-PERM-006 extended 2026-08-19 to a third input: nothing read the reminders channel's own importance, only app-level areNotificationsEnabled(), so muting just that channel — what long-pressing a notification and tapping \"Turn off notifications\" does — left every surface reporting no problem while notify() silently dropped each reminder (see reminders.md finding 12). REM-PERM-006 added 2026-08-18 (51 specs, was 50): the inline prompt, the list banner, and the save-time dialog each decided independently what to report and where to send the user, so with both permissions missing the banner opened \"Alarms & reminders\" — the problem that only delays a reminder — while saying reminders \"may not fire reliably,\" and denied notifications got no prompt or recovery path at all. All three now share one decision that returns the single most severe problem, with message and destination following from it (see reminders.md finding 11); REM-PERM-002/003/004 reworded to cite it. REM-PERM-005 added 2026-08-18 (50 specs, was 49): permission-display surfaces sampled state during composition and never learned it changed — the exact-alarm prompt had no re-check, and the list banner's ON_RESUME trigger never fires in multi-window mode, where visible activities stay RESUMED while the user grants in an adjacent pane. Both now observe ACTION_SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED (see reminders.md finding 10). enableReminder returned before arming whenever the stored nextFireAt was still valid, so a RANDOM reminder whose pending alarm the OS had dropped (force-stop, app update, task-kill) stayed unarmed until a reboot; reconcileOnStartup only heals a null or stale nextFireAt. Fixed 2026-08-16 (reminders.md finding 8), with REM-SCHED-013/015 reworded — 013 as written prohibited the fix — and two tests that had pinned the bug rewritten. Suppression also ignored SubCategory events and scanned the whole event table; fixed 2026-08-16 via LS-BE-014 (finding 9). REM-SCHED-020 suppression never fired in production — the lookback was sized from the delivery instant instead of the scheduled one, collapsing it to alarm jitter; fixed 2026-08-15 (see reminders.md finding 7), along with an unbounded window that let future-dated events suppress. Deep full-text pass (2026-08-12) re-verified all 49 specs against code. Fixed: notification PendingIntent/id collision risk (categoryId.hashCode(), contradicted the LLD's own alarm-identity reasoning) now uses the same data-Uri technique as alarms; REM-DATA-003/004/REM-PERM-004/REM-NOTIF-005 spec wording reworded to match actual behavior; stale mode casing in reminders.md's ReminderEntity table corrected. No remaining known drift."

